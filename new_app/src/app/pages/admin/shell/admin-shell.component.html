<!-- Utility bar -->
<div class="util-bar" role="banner" aria-label="Editorial annex status">
  <div class="util-bar__left">
    <span class="util-bar__badge">EDITOR</span>
    <span class="util-bar__label">Editorial annex — unbound copy</span>
  </div>
  <div class="util-bar__right">
    <span class="util-bar__who">
      <span class="util-bar__handle">{{ auth.handle() }}</span>
      &nbsp;·&nbsp;signed in {{ formatLoginTime(auth.loginTime()) }}
    </span>
    <button class="util-bar__signout" type="button" (click)="signOut()">Sign out</button>
  </div>
</div>

<!-- Admin layout: side nav + content -->
<div class="admin-layout">
  <nav class="side-nav" aria-label="Editorial navigation">
    <div class="side-nav__group">PIPELINE</div>

    <a class="side-nav__row"
       routerLink="/admin/pipeline"
       routerLinkActive="side-nav__row--active">
      <svg class="side-nav__glyph" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1.5" y="6.5" width="13" height="3"/>
        <circle cx="4" cy="8" r="1.5" fill="currentColor"/>
        <circle cx="12" cy="8" r="1.5" fill="currentColor"/>
        <line x1="4" y1="8" x2="12" y2="8"/>
      </svg>
      <span class="side-nav__label">Status</span>
    </a>

    <div class="side-nav__divider"></div>
    <div class="side-nav__group">EDITORIAL OVERLAY</div>

    <a class="side-nav__row"
       routerLink="/admin/editorial"
       routerLinkActive="side-nav__row--active"
       [routerLinkActiveOptions]="{ exact: true }">
      <svg class="side-nav__glyph" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1.5" y="1.5" width="5.5" height="5.5"/>
        <rect x="9" y="1.5" width="5.5" height="5.5"/>
        <rect x="1.5" y="9" width="5.5" height="5.5"/>
        <rect x="9" y="9" width="5.5" height="5.5"/>
      </svg>
      <span class="side-nav__label">Overview</span>
    </a>

    <a class="side-nav__row"
       routerLink="/admin/editorial/countries"
       routerLinkActive="side-nav__row--active">
      <svg class="side-nav__glyph" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="2,12 5,4 9,7 12,2 14,9 10,11 7,14"/>
      </svg>
      <span class="side-nav__label">Countries</span>
      <span class="side-nav__count">—</span>
    </a>

    <a class="side-nav__row"
       routerLink="/admin/editorial/regions"
       routerLinkActive="side-nav__row--active">
      <svg class="side-nav__glyph" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="2" y1="4" x2="14" y2="4"/>
        <line x1="2" y1="8" x2="11" y2="8"/>
        <line x1="2" y1="12" x2="8" y2="12"/>
      </svg>
      <span class="side-nav__label">Regions</span>
      <span class="side-nav__count">—</span>
    </a>

    <a class="side-nav__row"
       routerLink="/admin/editorial/castle-quotes"
       routerLinkActive="side-nav__row--active">
      <svg class="side-nav__glyph" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3,10 C3,7 5,5.5 5,5.5 C5,5.5 3.5,7 3.5,9 C3.5,10.1 4.2,11 5.2,11 C6.2,11 7,10.2 7,9.2 C7,8.2 6.3,7.5 5.5,7.5"/>
        <path d="M9,10 C9,7 11,5.5 11,5.5 C11,5.5 9.5,7 9.5,9 C9.5,10.1 10.2,11 11.2,11 C12.2,11 13,10.2 13,9.2 C13,8.2 12.3,7.5 11.5,7.5"/>
      </svg>
      <span class="side-nav__label">Castle quotes</span>
      <span class="side-nav__count">—</span>
    </a>

    <a class="side-nav__row"
       routerLink="/admin/editorial/period-picks"
       routerLinkActive="side-nav__row--active">
      <svg class="side-nav__glyph" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="8,1.5 9.8,6.2 14.8,6.2 10.7,9.1 12.3,13.8 8,11 3.7,13.8 5.3,9.1 1.2,6.2 6.2,6.2"/>
      </svg>
      <span class="side-nav__label">Period picks</span>
      <span class="side-nav__count">—</span>
    </a>

    <a class="side-nav__row"
       routerLink="/admin/editorial/browse-bands"
       routerLinkActive="side-nav__row--active">
      <svg class="side-nav__glyph" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1.5" y="10" width="3" height="4.5"/>
        <rect x="6.5" y="6" width="3" height="8.5"/>
        <rect x="11.5" y="2" width="3" height="12.5"/>
      </svg>
      <span class="side-nav__label">Browse bands</span>
      <span class="side-nav__count">—</span>
    </a>

    <div class="side-nav__divider"></div>
    <div class="side-nav__group">REFERENCE</div>

    <a class="side-nav__row"
       routerLink="/admin/backups"
       routerLinkActive="side-nav__row--active">
      <svg class="side-nav__glyph" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8,1 A7,7 0 1,0 14.5,5.5"/>
        <polyline points="14.5,1 14.5,5.5 10,5.5"/>
        <line x1="8" y1="5" x2="8" y2="11"/>
        <polyline points="5.5,8.5 8,11 10.5,8.5"/>
      </svg>
      <span class="side-nav__label">Backups</span>
    </a>

    <a class="side-nav__row"
       routerLink="/admin/schema"
       routerLinkActive="side-nav__row--active">
      <svg class="side-nav__glyph" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4,2 L2,2 L2,7 L1,8 L2,9 L2,14 L4,14"/>
        <path d="M12,2 L14,2 L14,7 L15,8 L14,9 L14,14 L12,14"/>
      </svg>
      <span class="side-nav__label">Schema</span>
    </a>

    <a class="side-nav__row"
       routerLink="/admin/api-reference"
       routerLinkActive="side-nav__row--active">
      <svg class="side-nav__glyph" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polyline points="5,4 2,8 5,12"/>
        <polyline points="11,4 14,8 11,12"/>
        <line x1="9" y1="3" x2="7" y2="13"/>
      </svg>
      <span class="side-nav__label">API reference</span>
    </a>
  </nav>

  <main class="admin-main">
    <router-outlet />
  </main>
</div>
